<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tinoprop – Diagrama ER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --border: #252a36;
    --accent: #4f9cf9;
    --accent2: #f97b4f;
    --accent3: #7bf9a0;
    --accent4: #f9d94f;
    --text: #e8eaf0;
    --muted: #6b7384;
    --fk: rgba(79,156,249,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Sora', sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--accent);
  }
  header span {
    font-size: 11px; color: var(--muted);
    font-family: 'Space Mono', monospace;
  }
  .legend {
    margin-left: auto;
    display: flex; gap: 16px; align-items: center;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── CANVAS ── */
  #canvas {
    position: fixed; top: 44px; left: 0; right: 0; bottom: 36px;
    overflow: hidden; cursor: grab;
  }
  #canvas:active { cursor: grabbing; }
  #world {
    position: absolute;
    transform-origin: 0 0;
  }

  /* ── SVG LINES ── */
  #lines {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }
  .rel-line { stroke-width: 1.5; fill: none; }
  .rel-fk   { stroke: var(--accent); stroke-dasharray: 4 3; opacity: 0.55; }
  .rel-idx  { stroke: var(--muted);  stroke-dasharray: 2 4; opacity: 0.30; }

  /* ── TABLES ── */
  .tbl {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 200px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    transition: box-shadow 0.2s;
    cursor: default;
    user-select: none;
  }
  .tbl:hover { box-shadow: 0 6px 32px rgba(79,156,249,0.18), 0 0 0 1px var(--accent); z-index: 50; }
  .tbl.dragging { opacity: 0.92; z-index: 200; box-shadow: 0 12px 48px rgba(0,0,0,0.7); }

  .tbl-head {
    padding: 8px 12px;
    border-radius: 7px 7px 0 0;
    display: flex; align-items: center; gap: 8px;
    cursor: move;
  }
  .tbl-head .icon { font-size: 13px; }
  .tbl-head .name {
    font-family: 'Space Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tbl-head .badge {
    margin-left: auto;
    font-size: 9px; color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .tbl-body { padding: 4px 0 6px; }
  .tbl-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 12px;
    font-size: 11px;
    line-height: 1.7;
  }
  .tbl-row:hover { background: rgba(255,255,255,0.03); }
  .col-icon { font-size: 10px; width: 14px; text-align: center; flex-shrink: 0; }
  .col-name { flex: 1; color: var(--text); font-family: 'Space Mono', monospace; font-size: 10px; }
  .col-type { color: var(--muted); font-size: 9px; font-family: 'Space Mono', monospace; }

  .pk  .col-name { color: var(--accent4); }
  .fk  .col-name { color: var(--accent); }
  .idx .col-name { color: var(--accent3); }

  /* colors per group */
  .color-core   { background: linear-gradient(90deg, #1a2235, #151820); border-bottom: 2px solid #4f9cf9; }
  .color-ops    { background: linear-gradient(90deg, #231a14, #151820); border-bottom: 2px solid #f97b4f; }
  .color-sup    { background: linear-gradient(90deg, #14231a, #151820); border-bottom: 2px solid #7bf9a0; }
  .color-sys    { background: linear-gradient(90deg, #231f12, #151820); border-bottom: 2px solid #f9d94f; }

  /* ── FOOTER ── */
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 8px 20px;
    font-size: 10px; color: var(--muted);
    font-family: 'Space Mono', monospace;
    background: rgba(13,15,20,0.9);
    border-top: 1px solid var(--border);
    display: flex; gap: 20px;
  }

  /* ── ZOOM CONTROLS ── */
  .zoom-controls {
    position: fixed; bottom: 44px; right: 16px;
    display: flex; flex-direction: column; gap: 4px; z-index: 100;
  }
  .zoom-btn {
    width: 30px; height: 30px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
    transition: background 0.15s;
  }
  .zoom-btn:hover { background: var(--border); }
</style>
</head>

const world = document.getElementById('world');
const svgEl = document.getElementById('lines');
const headColors = { core:'color-core', ops:'color-ops', sup:'color-sup', sys:'color-sys' };
const groupIcons = { core:'◈', ops:'⬡', sup:'◇', sys:'⚙' };

// Build table elements
const tblEls = {};
tables.forEach(t => {
  const el = document.createElement('div');
  el.className = 'tbl';
  el.id = 'tbl_' + t.id;
  el.style.left = t.x + 'px';
  el.style.top  = t.y + 'px';

  const colCount = t.cols.length;
  let rows = '';
  t.cols.forEach(c => {
    let cls = 'tbl-row';
    let icon = '·';
    if (c.pk)  { cls += ' pk';  icon = '🔑'; }
    else if (c.fk) { cls += ' fk'; icon = '🔗'; }
    rows += `<div class="${cls}">
      <span class="col-icon">${icon}</span>
      <span class="col-name">${c.name}</span>
      <span class="col-type">${c.type}</span>
    </div>`;
  });

  el.innerHTML = `
    <div class="tbl-head ${headColors[t.group]}">
      <span class="icon">${groupIcons[t.group]}</span>
      <span class="name">${t.label}</span>
      <span class="badge">${colCount} cols</span>
    </div>
    <div class="tbl-body">${rows}</div>`;

  world.appendChild(el);
  tblEls[t.id] = el;
  makeDraggable(el, t);
});

function getCenter(el) {
  return {
    x: parseInt(el.style.left) + el.offsetWidth / 2,
    y: parseInt(el.style.top)  + el.offsetHeight / 2,
  };
}
function getAnchor(fromEl, toEl) {
  const fx = parseInt(fromEl.style.left), fw = fromEl.offsetWidth;
  const fy = parseInt(fromEl.style.top),  fh = fromEl.offsetHeight;
  const tx = parseInt(toEl.style.left),   tw = toEl.offsetWidth;
  const ty = parseInt(toEl.style.top),    th = toEl.offsetHeight;
  const fcx = fx + fw/2, fcy = fy + fh/2;
  const tcx = tx + tw/2, tcy = ty + th/2;
  // pick nearest edge
  const dx = tcx - fcx, dy = tcy - fcy;
  let x1, y1, x2, y2;
  if (Math.abs(dx) > Math.abs(dy)) {
    x1 = dx > 0 ? fx+fw : fx; y1 = fcy;
    x2 = dx > 0 ? tx : tx+tw; y2 = tcy;
  } else {
    x1 = fcx; y1 = dy > 0 ? fy+fh : fy;
    x2 = tcx; y2 = dy > 0 ? ty : ty+th;
  }
  return {x1,y1,x2,y2};
}

function drawLines() {
  svgEl.innerHTML = '';
  // Deduplicate: one line per (from-table → to-table) pair
  const drawn = new Set();
  fkRels.forEach(([fromT,,toT]) => {
    const key = [fromT,toT].sort().join('|');
    if (drawn.has(key)) return;
    drawn.add(key);
    const fromEl = tblEls[fromT], toEl = tblEls[toT];
    if (!fromEl || !toEl) return;
    const {x1,y1,x2,y2} = getAnchor(fromEl, toEl);
    const cx = (x1+x2)/2, mx = (x1+x2)/2;
    // smooth bezier
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const d = `M ${x1} ${y1} C ${x1 + (x2-x1)*0.5} ${y1}, ${x1 + (x2-x1)*0.5} ${y2}, ${x2} ${y2}`;
    path.setAttribute('d', d);
    path.setAttribute('class','rel-line rel-fk');
    // arrowhead
    const marker = document.createElementNS('http://www.w3.org/2000/svg','circle');
    marker.setAttribute('cx', x2); marker.setAttribute('cy', y2);
    marker.setAttribute('r', '3');
    marker.setAttribute('fill', '#4f9cf9');
    marker.setAttribute('opacity', '0.6');
    const markerS = document.createElementNS('http://www.w3.org/2000/svg','circle');
    markerS.setAttribute('cx', x1); markerS.setAttribute('cy', y1);
    markerS.setAttribute('r', '2.5');
    markerS.setAttribute('fill', '#f97b4f');
    markerS.setAttribute('opacity', '0.5');
    svgEl.appendChild(path);
    svgEl.appendChild(marker);
    svgEl.appendChild(markerS);
  });
}

// ── DRAG TABLES ───────────────────────────────────────────────────────────
function makeDraggable(el, t) {
  const head = el.querySelector('.tbl-head');
  let dragging = false, ox, oy;
  head.addEventListener('mousedown', e => {
    dragging = true;
    ox = e.clientX - parseInt(el.style.left) * scale;
    oy = e.clientY - parseInt(el.style.top)  * scale;
    el.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    el.style.left = ((e.clientX - ox) / scale) + 'px';
    el.style.top  = ((e.clientY - oy) / scale) + 'px';
    drawLines();
  });
  document.addEventListener('mouseup', () => {
    dragging = false;
    el.classList.remove('dragging');
  });
}

// ── PAN & ZOOM ────────────────────────────────────────────────────────────
let scale = 0.65, tx = -60, ty = -20;
const canvas = document.getElementById('canvas');

function applyTransform() {
  world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  drawLines();
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.06 : -0.06;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - tx) / scale;
  const wy = (my - ty) / scale;
  scale = Math.min(2, Math.max(0.2, scale + delta));
  tx = mx - wx * scale;
  ty = my - wy * scale;
  applyTransform();
}, {passive:false});

let panning = false, panX, panY;
canvas.addEventListener('mousedown', e => {
  if (e.target.closest('.tbl')) return;
  panning = true;
  panX = e.clientX - tx;
  panY = e.clientY - ty;
});
document.addEventListener('mousemove', e => {
  if (!panning) return;
  tx = e.clientX - panX;
  ty = e.clientY - panY;
  applyTransform();
});
document.addEventListener('mouseup', () => { panning = false; });

document.getElementById('zoomIn').onclick  = () => { scale = Math.min(2, scale+0.1); applyTransform(); };
document.getElementById('zoomOut').onclick = () => { scale = Math.max(0.2,scale-0.1); applyTransform(); };
document.getElementById('zoomReset').onclick = () => { scale=0.65; tx=-60; ty=-20; applyTransform(); };

// Init
setTimeout(() => { applyTransform(); }, 50);
</script>
